<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal CRUD fixture</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;color:#20342e;background:#f3f6f4;margin:0}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:32px;margin:0}p{color:#52645e}.bar,.actions{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}.layout{display:grid;grid-template-columns:1fr 1.4fr;gap:28px}label{display:block;margin:12px 0}input,textarea,select,button{font:inherit;border:1px solid #9bab9f;border-radius:4px;padding:10px;background:white;color:inherit}input,textarea{display:block;width:100%}textarea{min-height:90px;resize:vertical}button{cursor:pointer}button:hover{background:#e2eee5}:focus-visible{outline:3px solid #176447;outline-offset:3px}#records button{display:block;width:100%;text-align:left;margin:8px 0;overflow-wrap:anywhere}#records small{display:block}#error{color:#922616;white-space:pre-wrap}#status{color:#176447}code,pre{overflow-wrap:anywhere;white-space:pre-wrap}section{min-width:0}small{color:#52645e}@media(max-width:650px){.layout{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><main>
<h1>Journal CRUD fixture</h1><p>Isolated browser test data. No model calls or PocketBase connection. This fixture does not define production journal permissions.</p>
<div class="bar"><label>Active agent <select id="agent"><option value="agent-a">Agent A</option><option value="agent-b">Agent B</option></select></label><label>Attached journal <select id="journal"><option value="journal-a">Journal A</option><option value="journal-b">Journal B</option></select></label><button id="new" type="button">New record</button><button id="reload" type="button">Reload stored data</button></div>
<p id="binding"></p><p id="error" role="alert"></p><p id="status" role="status"></p>
<div class="layout"><section><h2>Stored records</h2><div id="records"></div><h2>Selected record</h2><pre id="record-detail">No record selected.</pre><p id="backups"></p></section>
<section><h2 id="editor-title">Create record</h2><form id="editor" novalidate><label>Title<input id="title" maxlength="120"></label><label>Request<textarea id="request"></textarea></label><label>Response<textarea id="response"></textarea></label><label>Notes<textarea id="notes"></textarea></label><label>Metadata JSON<textarea id="metadata">{}</textarea></label><div class="actions"><button id="save" type="submit">Create record</button><button id="cancel" type="button">Cancel edits</button><button id="delete" type="button" disabled>Delete record</button></div></form></section></div>
</main><script>
'use strict';
const KEY='simpleagent.crud-fixture.v1';
const $=id=>document.getElementById(id);
let state, selected=null, active='agent-a';
const initial=()=>({version:1,revision:0,bindings:{'agent-a':'journal-a','agent-b':'journal-b'},journals:{'journal-a':{entries:[]},'journal-b':{entries:[]}},backups:[]});
function read(){const raw=localStorage.getItem(KEY);if(raw===null)return initial();const value=JSON.parse(raw);if(value.version!==1||!Number.isInteger(value.revision)||!value.bindings||!value.journals||!Array.isArray(value.backups))throw Error('Stored data is invalid; original data retained.');for(const id of ['journal-a','journal-b'])if(!Array.isArray(value.journals[id]?.entries))throw Error('Stored journal is invalid; original data retained.');for(const agent of ['agent-a','agent-b'])if(!value.journals[value.bindings[agent]])throw Error('Stored binding is invalid; original data retained.');return value;}
function error(e){$('error').textContent=e.message||String(e);$('status').textContent='';}
function commit(next){const current=read();if(current.revision!==state.revision)throw Error('Stored data changed. Reload stored data before saving.');next.revision=state.revision+1;localStorage.setItem(KEY,JSON.stringify(next));state=next;}
function journal(){return state.bindings[active];}
function records(){return state.journals[journal()].entries;}
function clear(){selected=null;$('editor').reset();$('metadata').value='{}';$('editor-title').textContent='Create record';$('save').textContent='Create record';$('delete').disabled=true;$('record-detail').textContent='No record selected.';}
function inspect(id){selected=id;const r=records().find(r=>r.id===id);if(!r){clear();return;}for(const key of ['title','request','response','notes'])$(key).value=r[key];$('metadata').value=JSON.stringify(r.metadata,null,2);$('editor-title').textContent='Update record';$('save').textContent='Save changes';$('delete').disabled=false;$('record-detail').textContent=JSON.stringify(r,null,2);}
function render(){ $('journal').value=journal();$('binding').textContent=active+' → '+journal();$('backups').textContent=state.backups.length+' deleted-record backup(s) retained';$('records').replaceChildren();for(const r of records()){const button=document.createElement('button');button.type='button';button.textContent=r.title;button.dataset.recordId=r.id;const small=document.createElement('small');small.textContent=r.authorAgentId+' · '+r.id;button.append(small);button.onclick=()=>{inspect(r.id);$('error').textContent='';};$('records').append(button);}if(!records().length)$('records').textContent='No records in this journal.';}
function load(){try{state=read();$('error').textContent='';clear();render();$('save').disabled=false;$('journal').disabled=false;}catch(e){state=null;error(e);$('save').disabled=true;$('journal').disabled=true;}}
$('editor').onsubmit=event=>{event.preventDefault();try{if(!state)throw Error('Reload valid data first.');const title=$('title').value.trim();if(!title)throw Error('Title is required.');if(title.length>120)throw Error('Title is too long.');let metadata;try{metadata=JSON.parse($('metadata').value);}catch{throw Error('Metadata must be valid JSON.');}const fields={title,request:$('request').value,response:$('response').value,notes:$('notes').value,metadata};if(new TextEncoder().encode(JSON.stringify(fields)).length>65536)throw Error('Record exceeds the 64 KiB fixture limit.');const next=structuredClone(state),entries=next.journals[journal()].entries,now=new Date().toISOString();let record;if(selected){const index=entries.findIndex(r=>r.id===selected);if(index<0)throw Error('Record no longer exists.');record={...entries[index],...fields,updatedAt:now,updatedBy:active};entries[index]=record;}else{record={...fields,id:crypto.randomUUID(),journalId:journal(),authorAgentId:active,createdAt:now,updatedAt:now,updatedBy:active};entries.push(record);}commit(next);render();inspect(record.id);$('error').textContent='';$('status').textContent='Record saved.';}catch(e){error(e);}};
$('delete').onclick=()=>{try{if(!selected)return;const record=records().find(r=>r.id===selected);if(!window.confirm('Delete this test record? A backup will be retained.'))return;const next=structuredClone(state);next.backups.push({record:structuredClone(record),deletedAt:new Date().toISOString(),deletedBy:active});next.journals[journal()].entries=next.journals[journal()].entries.filter(r=>r.id!==selected);commit(next);clear();render();$('error').textContent='';$('status').textContent='Record deleted. Backup retained.';}catch(e){error(e);}};
$('new').onclick=()=>{clear();$('status').textContent='';};$('cancel').onclick=()=>{if(selected)inspect(selected);else clear();$('error').textContent='';};$('reload').onclick=load;
$('agent').onchange=()=>{active=$('agent').value;if(state){clear();render();}};
$('journal').onchange=()=>{try{const next=structuredClone(state);next.bindings[active]=$('journal').value;commit(next);clear();render();$('error').textContent='';$('status').textContent='Journal attached.';}catch(e){error(e);if(state)$('journal').value=journal();}};
window.addEventListener('storage',event=>{if(event.key===KEY){$('error').textContent='Stored data changed in another tab. Reload before saving.';}});
load();
</script></body></html>
